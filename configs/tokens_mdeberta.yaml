notes: "E2's errors trace to the token model (missed light rewrites get about 0.45 rewritten probability, human blogs called fusion carry a confident false spike), not to its summaries. Needs bf16 (L4/A100): mDeBERTa is known to overflow in fp16. Batch 8 x 2 accumulation keeps E2's effective batch within 24 GB; checkpoints every checkpoint_every micro-batches so a Colab session can resume"
