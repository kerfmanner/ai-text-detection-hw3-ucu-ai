id: X8
reference: B0
change: "masked word n-grams (text distortion): the most frequent words of the training texts and punctuation are kept, every other word becomes '*' repeated to its length; word 1-3-gram TF-IDF + linear SVM, small search over the kept vocabulary and C"
notes: "a style/syntax member with almost no topic signal (Stamatatos 2017, text distortion); kept words are learned on the fitted training texts only, one shared list for EN and DE"
seed: 42
search_docs: 20000
fit_docs: 120000
features:
  masked300: {analyzer: word, ngram_range: [1, 3], lowercase: true, token_pattern: "\\S+", keep_words: 300}
  masked1000: {analyzer: word, ngram_range: [1, 3], lowercase: true, token_pattern: "\\S+", keep_words: 1000}
grid:
  features: [[masked300], [masked1000]]
  models:
    - {name: linear_svc, C: 0.1, class_weight: balanced}
    - {name: linear_svc, C: 0.3, class_weight: balanced}
    - {name: linear_svc, C: 1.0, class_weight: balanced}
smoke: {search_docs: 1500, fit_docs: 3000, eval_docs: 1000}
