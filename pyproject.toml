[project]
name = "hw3"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.4.6",
    "pandas==3.1.1",
    "pyarrow==26.0.1",
    "scipy==1.17.1",
    "scikit-learn==1.9.1",
    "pyyaml==6.0.4",
    "matplotlib==3.11.2",
    "tqdm==4.70.1",
    "torch==2.15.0",
    "transformers==5.24.0",
    "sentencepiece==0.2.3",
    "protobuf==7.36.2",
    "kaggle==2.2.5",
]

[dependency-groups]
dev = ["ipykernel==7.4.0"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
